<!doctype html>
<html data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Yosanoskey Settings</title>
    <link rel="stylesheet" href="../../node_modules/@primer/css/dist/primer.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="settings-header markdown-body">
      <button id="back" class="btn-octicon" aria-label="Back" title="Back">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z" />
        </svg>
      </button>
      <h1>Settings</h1>
    </header>

    <div class="form-group flattened">
      <div class="form-group-header">
        <label for="theme">Theme</label>
      </div>
      <div class="form-group-body">
        <select id="theme" class="form-select">
          <option value="system">Device</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <div class="form-group-body">
        <div class="form-checkbox">
          <label><input type="checkbox" id="smoothScrolling" /> Smooth Scrolling *1</label>
        </div>
      </div>
    </div>

    <p class="note footnote">*1 Requires restart</p>

    <script src="renderer.js"></script>
  </body>
</html>
